name: ♻️Relatórios Power BI para WhatsApp

on:
  workflow_dispatch:  # Disparo manual via botão no GitHub

jobs:
  executar-relatorios:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: playwright install chromium

      - name: Executar script de automação
        env:
          GITHUB_ACTIONS: "true"
          PYTHONIOENCODING: utf-8
          POWERBI_KEY: ${{ secrets.POWERBI_KEY }}
          WHATSAPP_KEY: ${{ secrets.WHATSAPP_KEY }}
        run: python 00z_capturar_envia.py

      - name: Upload de logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-automacao
          path: ${{ runner.temp }}/relatorios/log_automacao.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload dos prints capturados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-powerbi
          path: ${{ runner.temp }}/relatorios/PRINT_*.png
          retention-days: 3
          if-no-files-found: ignore
