name: 🕒 01 Coletor Simples (Agendado)

on:
  workflow_dispatch: 

jobs:
  executar_rotina:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TZ: America/Sao_Paulo
      CPFL_USER: ${{ secrets.CPFL_USER }}
      CPFL_PASS: ${{ secrets.CPFL_PASS }}
      SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
      SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
      SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
      PYTHONUNBUFFERED: 1

    steps:
      - name: 📥 1. Sincronizar Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 2. Preparar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 3. Instalar Bibliotecas
        run: |
          pip install --upgrade pip
          pip install playwright requests python-dotenv
          playwright install chromium --with-deps

      - name: 🚀 4. Executar Nao Visitadas
        id: nao_visitadas
        continue-on-error: true
        run: python3 04_Nao_Visitadas.py

      - name: ⏳ 5. Aguardar (180s)
        run: sleep 180

      - name: 🚀 6. Executar ELF Hora
        run: python3 01_ELF_Hora.py

      - name: ⏳ 7. Aguardar (240s)
        run: sleep 240

      - name: 🤖 8. Coletar e Enviar para SharePoint
        run: python3 -u 00a_Coletor.py simples

      - name: 📸 9. Salvar Evidências de Erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-de-erro
          path: "*.png"
          if-no-files-found: ignore